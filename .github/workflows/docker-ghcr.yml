name: Docker 2.x (GHCR)

on:
  push:
    branches:
      - docker/ghcr-2x
    paths:
      - ".github/workflows/docker-ghcr.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "entrypoint.sh"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "ui/flutter/**"
      - ".github/workflows/scripts/flutter_local_font.dart"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-2x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Build web UI
        working-directory: ui/flutter
        run: |
          flutter pub get
          flutter build web --no-web-resources-cdn --dart-define=UPDATE_CHANNEL=docker

      - name: Bundle web UI for Go embed
        run: |
          dart ../../.github/workflows/scripts/flutter_local_font.dart
        working-directory: ui/flutter

      - name: Copy web UI into Go build context
        run: |
          mkdir -p cmd/web/dist
          cp -a ui/flutter/build/web/. cmd/web/dist/
          test -s cmd/web/dist/index.html

      - name: Set image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=2.0-edge
            type=sha,format=short,prefix=sha-

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=2.0-edge-${{ github.sha }}
          cache-from: type=gha,scope=gopeed-2x
          cache-to: type=gha,mode=max,scope=gopeed-2x
